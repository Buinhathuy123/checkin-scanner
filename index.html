<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Savills Check-in Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 20px;

  font-family:
    Arial,
    sans-serif;

  background: #f5f5f5;

  text-align: center;

}


.container {

  max-width: 500px;

  margin: auto;

  background: white;

  padding: 25px;

  border-radius: 20px;

  box-shadow:
    0 5px 25px
    rgba(0,0,0,0.1);

}


/* ============================================================
   LOGIN
   ============================================================ */

#loginSection {

  display: block;

}


#scannerSection {

  display: none;

}


.login-logo {

  max-width: 180px;

  max-height: 80px;

  margin-bottom: 15px;

}


h1 {

  margin-top: 0;

}


.login-title {

  margin-bottom: 25px;

}


.form-group {

  text-align: left;

  margin-bottom: 18px;

}


.form-group label {

  display: block;

  margin-bottom: 7px;

  font-weight: bold;

  font-size: 14px;

}


.form-group input {

  width: 100%;

  padding: 13px;

  border: 1px solid #ccc;

  border-radius: 10px;

  font-size: 16px;

  outline: none;

}


.form-group input:focus {

  border-color: #777;

}


.login-button {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 10px;

  background: #FFD700;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


.login-button:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}


.login-status {

  margin-top: 15px;

  font-size: 14px;

  min-height: 20px;

}


.login-error {

  color: red;

}


.login-success {

  color: green;

}


/* ============================================================
   SCANNER
   ============================================================ */

.scanner-header {

  position: relative;

}


.logout-button {

  position: absolute;

  right: 0;

  top: 0;

  padding: 8px 12px;

  border: none;

  border-radius: 8px;

  background: #eee;

  cursor: pointer;

  font-size: 13px;

}


#reader {

  width: 100%;

  margin-top: 20px;

}


.start-button {

  padding: 14px 25px;

  border: none;

  border-radius: 10px;

  background: #FFD700;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;

}


.start-button:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}


#status {

  margin-top: 20px;

  font-size: 17px;

  font-weight: bold;

  line-height: 1.5;

}


.success {

  color: green;

}


.error {

  color: red;

}


.info {

  color: #555;

}


.warning {

  color: #d97706;

}


.debug {

  margin-top: 15px;

  font-size: 12px;

  color: #777;

  word-break: break-word;

}

</style>

</head>


<body>


<div class="container">


<!-- ==========================================================
     LOGIN SECTION
     ========================================================== -->

<div id="loginSection">


  <h1>
    Savills
  </h1>


  <p class="login-title">
    Check-in Scanner
  </p>


  <div class="form-group">

    <label for="username">
      Username
    </label>


    <input
      type="text"
      id="username"
      autocomplete="username"
      placeholder="Enter username"
    >

  </div>


  <div class="form-group">

    <label for="password">
      Password
    </label>


    <input
      type="password"
      id="password"
      autocomplete="current-password"
      placeholder="Enter password"
    >

  </div>


  <button
    class="login-button"
    id="loginButton"
    onclick="login()"
  >

    Login

  </button>


  <div
    id="loginStatus"
    class="login-status"
  ></div>


</div>


<!-- ==========================================================
     SCANNER SECTION
     ========================================================== -->

<div id="scannerSection">


  <div class="scanner-header">

    <button
      class="logout-button"
      onclick="logout()"
    >

      Logout

    </button>


    <h1>
      Check-in Scanner
    </h1>

  </div>


  <p>
    Scan the customer's QR code
  </p>


  <button
    id="startButton"
    class="start-button"
    onclick="startScanner()"
  >

    Start Camera

  </button>


  <div
    id="reader"
  ></div>


  <div
    id="status"
    class="info"
  >

    Camera not started.

  </div>


  <div
    id="debug"
    class="debug"
  ></div>


</div>


</div>


<script>


// ============================================================
// CONFIGURATION
// ============================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbx1LEKvLneIrVQxkM15O8nicV9LxDow8QB0a2ZHad1Nz2nfYyraEOKzqluzKTDlRJoAFQ/exec";


// ============================================================
// GLOBAL VARIABLES
// ============================================================

let scanner = null;

let scanning = false;

let processing = false;

let sessionToken = null;


// ============================================================
// LOGIN
// ============================================================

function login() {

  const username =
    document.getElementById(
      "username"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  const button =
    document.getElementById(
      "loginButton"
    );


  const status =
    document.getElementById(
      "loginStatus"
    );


  // ==========================================================
  // VALIDATE EMPTY
  // ==========================================================

  if (
    !username ||
    !password
  ) {

    status.innerText =
      "Please enter username and password.";

    status.className =
      "login-status login-error";

    return;

  }


  button.disabled = true;


  status.innerText =
    "Signing in...";

  status.className =
    "login-status";


  // ==========================================================
  // CALLBACK
  // ==========================================================

  const callbackName =
    "loginCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      console.log(
        "LOGIN RESPONSE:",
        result
      );


      try {

        if (
          result &&
          result.success &&
          result.token
        ) {

          // ==================================================
          // SAVE TOKEN
          // ==================================================

          sessionToken =
            result.token;


          sessionStorage.setItem(
            "scanner_session_token",
            sessionToken
          );


          // ==================================================
          // CLEAR PASSWORD
          // ==================================================

          document.getElementById(
            "password"
          ).value = "";


          // ==================================================
          // SHOW SCANNER
          // ==================================================

          showScanner();


        }

        else {

          status.innerText =
            (
              result &&
              result.message
            )
              ? result.message
              : "Invalid username or password.";


          status.className =
            "login-status login-error";


          button.disabled =
            false;

        }

      }

      catch (error) {

        console.error(
          "Login handling error:",
          error
        );


        status.innerText =
          "Unable to process login response.";

        status.className =
          "login-status login-error";


        button.disabled =
          false;

      }


      finally {

        delete window[
          callbackName
        ];

      }

    };


  // ==========================================================
  // CREATE SCRIPT
  // ==========================================================

  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=login" +
    "&username=" +
    encodeURIComponent(
      username
    ) +
    "&password=" +
    encodeURIComponent(
      password
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  script.onerror =
    function() {

      console.error(
        "Login API request failed."
      );


      status.innerText =
        "Unable to connect to authentication server.";

      status.className =
        "login-status login-error";


      button.disabled =
        false;


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    };


  script.onload =
    function() {

      setTimeout(

        function() {

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

        },

        500

      );

    };


  document.body.appendChild(
    script
  );

}


// ============================================================
// SHOW SCANNER
// ============================================================

function showScanner() {

  document.getElementById(
    "loginSection"
  ).style.display =
    "none";


  document.getElementById(
    "scannerSection"
  ).style.display =
    "block";


  document.getElementById(
    "status"
  ).innerText =
    "Login successful. Start camera.";

}


// ============================================================
// SHOW LOGIN
// ============================================================

function showLogin() {

  document.getElementById(
    "loginSection"
  ).style.display =
    "block";


  document.getElementById(
    "scannerSection"
  ).style.display =
    "none";


  document.getElementById(
    "username"
  ).value =
    "";


  document.getElementById(
    "password"
  ).value =
    "";


  document.getElementById(
    "loginStatus"
  ).innerText =
    "";


  document.getElementById(
    "loginButton"
  ).disabled =
    false;

}


// ============================================================
// LOGOUT
// ============================================================

async function logout() {

  // ==========================================================
  // STOP CAMERA
  // ==========================================================

  await stopScanner();


  // ==========================================================
  // REMOVE SERVER SESSION
  // ==========================================================

  if (
    sessionToken
  ) {

    const tokenToLogout =
      sessionToken;


    const callbackName =
      "logoutCallback_" +
      Date.now();


    window[callbackName] =
      function(result) {

        console.log(
          "Logout response:",
          result
        );


        delete window[
          callbackName
        ];

      };


    const script =
      document.createElement(
        "script"
      );


    script.src =
      API_URL +
      "?action=logout" +
      "&token=" +
      encodeURIComponent(
        tokenToLogout
      ) +
      "&callback=" +
      encodeURIComponent(
        callbackName
      );


    script.onerror =
      function() {

        delete window[
          callbackName
        ];

      };


    document.body.appendChild(
      script
    );

  }


  // ==========================================================
  // CLEAR LOCAL SESSION
  // ==========================================================

  sessionToken =
    null;


  sessionStorage.removeItem(
    "scanner_session_token"
  );


  showLogin();

}


// ============================================================
// RESTORE SESSION
// ============================================================
//
// Nếu refresh trang trong thời gian session còn hiệu lực,
// token vẫn còn trong sessionStorage.
//
// Backend vẫn là nơi quyết định token có hợp lệ hay không.
// ============================================================

function restoreSession() {

  const savedToken =
    sessionStorage.getItem(
      "scanner_session_token"
    );


  if (
    !savedToken
  ) {

    return;

  }


  sessionToken =
    savedToken;


  showScanner();

}


// ============================================================
// START SCANNER
// ============================================================

async function startScanner() {

  // ==========================================================
  // REQUIRE LOGIN
  // ==========================================================

  if (
    !sessionToken
  ) {

    showLogin();

    return;

  }


  if (
    scanning
  ) {

    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  const button =
    document.getElementById(
      "startButton"
    );


  const debug =
    document.getElementById(
      "debug"
    );


  status.innerText =
    "Requesting camera permission...";


  status.className =
    "info";


  debug.innerText =
    "";


  button.disabled =
    true;


  // ==========================================================
  // CHECK HTTPS
  // ==========================================================

  if (
    location.protocol !== "https:" &&
    location.hostname !== "localhost" &&
    location.hostname !== "127.0.0.1"
  ) {

    status.innerText =
      "Camera requires HTTPS.";

    status.className =
      "error";


    debug.innerText =
      "Open the scanner using your GitHub Pages https:// address.";


    button.disabled =
      false;


    return;

  }


  // ==========================================================
  // CHECK CAMERA API
  // ==========================================================

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.innerText =
      "Camera is not supported by this browser.";

    status.className =
      "error";


    debug.innerText =
      "navigator.mediaDevices.getUserMedia is unavailable.";


    button.disabled =
      false;


    return;

  }


  // ==========================================================
  // CREATE SCANNER
  // ==========================================================

  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );

  }

  catch (error) {

    console.error(
      "Scanner creation error:",
      error
    );


    status.innerText =
      "Unable to initialize QR scanner.";

    status.className =
      "error";


    debug.innerText =
      error.message ||
      String(error);


    button.disabled =
      false;


    return;

  }


  // ==========================================================
  // TRY CAMERA
  // ==========================================================

  try {

    await startCamera(
      {
        facingMode:
          "environment"
      }
    );


    scanning =
      true;


    status.innerText =
      "Camera ready. Scan QR code.";

    status.className =
      "info";


    debug.innerText =
      "";


  }

  catch (firstError) {

    console.warn(
      "Environment camera failed:",
      firstError
    );


    // ========================================================
    // FALLBACK
    // ========================================================

    try {

      await startCamera(
        {
          facingMode:
            "user"
        }
      );


      scanning =
        true;


      status.innerText =
        "Camera ready. Scan QR code.";

      status.className =
        "info";


      debug.innerText =
        "Using fallback camera.";


    }

    catch (secondError) {

      console.error(
        "Camera start failed:",
        secondError
      );


      scanning =
        false;


      button.disabled =
        false;


      status.innerText =
        "Unable to access camera.";

      status.className =
        "error";


      debug.innerText =
        getCameraErrorMessage(
          secondError
        );


      try {

        if (
          scanner
        ) {

          await scanner.clear();

        }

      }

      catch (cleanupError) {

        console.warn(
          "Scanner cleanup error:",
          cleanupError
        );

      }

    }

  }

}


// ============================================================
// START CAMERA HELPER
// ============================================================

function startCamera(
  cameraConfig
) {

  return scanner.start(

    cameraConfig,

    {

      fps: 10,

      qrbox: {

        width: 250,

        height: 250

      }

    },

    onScanSuccess,

    onScanFailure

  );

}


// ============================================================
// STOP SCANNER
// ============================================================

async function stopScanner() {

  scanning =
    false;


  processing =
    false;


  if (
    scanner
  ) {

    try {

      await scanner.stop();

    }

    catch (error) {

      console.warn(
        "Scanner stop error:",
        error
      );

    }


    try {

      await scanner.clear();

    }

    catch (error) {

      console.warn(
        "Scanner clear error:",
        error
      );

    }


    scanner =
      null;

  }


  const reader =
    document.getElementById(
      "reader"
    );


  if (
    reader
  ) {

    reader.innerHTML =
      "";

  }


  const button =
    document.getElementById(
      "startButton"
    );


  if (
    button
  ) {

    button.disabled =
      false;

  }

}


// ============================================================
// CAMERA ERROR MESSAGE
// ============================================================

function getCameraErrorMessage(
  error
) {

  if (
    !error
  ) {

    return "Unknown camera error.";

  }


  const message =
    String(
      error.message ||
      error
    );


  console.error(
    "Camera error:",
    message
  );


  if (
    message
      .toLowerCase()
      .includes(
        "notallowed"
      )
  ) {

    return (
      "Camera permission was denied. " +
      "Please check browser camera permissions."
    );

  }


  if (
    message
      .toLowerCase()
      .includes(
        "notfound"
      )
  ) {

    return (
      "No camera was found on this device."
    );

  }


  if (
    message
      .toLowerCase()
      .includes(
        "notreadable"
      )
  ) {

    return (
      "Camera is being used by another application."
    );

  }


  if (
    message
      .toLowerCase()
      .includes(
        "security"
      )
  ) {

    return (
      "Camera requires a secure HTTPS connection."
    );

  }


  return (
    "Camera error: " +
    message
  );

}


// ============================================================
// SCAN SUCCESS
// ============================================================

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (
    processing
  ) {

    return;

  }


  // ==========================================================
  // REQUIRE AUTHENTICATION
  // ==========================================================

  if (
    !sessionToken
  ) {

    showError(
      "Session expired. Please login again."
    );


    showLogin();


    return;

  }


  processing =
    true;


  console.log(
    "QR CONTENT:",
    decodedText
  );


  const qrId =
    extractQrId(
      decodedText
    );


  if (
    !qrId
  ) {

    showError(
      "Invalid QR code."
    );


    processing =
      false;


    return;

  }


  console.log(
    "QR ID:",
    qrId
  );


  showInfo(
    "Checking in..."
  );


  checkIn(
    qrId
  );

}


// ============================================================
// EXTRACT QR ID
// ============================================================

function extractQrId(
  qrContent
) {

  if (
    !qrContent
  ) {

    return null;

  }


  qrContent =
    String(
      qrContent
    ).trim();


  // ==========================================================
  // QR IS URL
  // ==========================================================

  try {

    const url =
      new URL(
        qrContent
      );


    const id =
      url.searchParams.get(
        "id"
      );


    if (
      id
    ) {

      return String(
        id
      ).trim();

    }

  }

  catch (error) {

    console.log(
      "QR is not a URL."
    );

  }


  // ==========================================================
  // FALLBACK
  // ==========================================================

  if (
    qrContent.length > 0
  ) {

    return qrContent;

  }


  return null;

}


// ============================================================
// CHECK-IN API
// ============================================================

function checkIn(
  qrId
) {

  // ==========================================================
  // REQUIRE TOKEN
  // ==========================================================

  if (
    !sessionToken
  ) {

    showError(
      "Session expired. Please login again."
    );


    processing =
      false;


    showLogin();


    return;

  }


  const callbackName =
    "checkInCallback_" +
    Date.now();


  console.log(
    "Callback:",
    callbackName
  );


  // ==========================================================
  // CREATE CALLBACK
  // ==========================================================

  window[callbackName] =
    function(result) {

      console.log(
        "CHECK-IN RESPONSE:",
        result
      );


      try {

        // ====================================================
        // SESSION EXPIRED
        // ====================================================

        if (
          result &&
          result.authenticated === false
        ) {

          showError(
            "Session expired. Please login again."
          );


          sessionToken =
            null;


          sessionStorage.removeItem(
            "scanner_session_token"
          );


          stopScanner();


          showLogin();


          return;

        }


        handleCheckInResult(
          result
        );

      }

      catch (error) {

        console.error(
          "Response handling error:",
          error
        );


        showError(
          "Invalid response from check-in server."
        );


        processing =
          false;

      }

      finally {

        delete window[
          callbackName
        ];

      }

    };


  // ==========================================================
  // CREATE SCRIPT
  // ==========================================================

  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=checkIn" +
    "&id=" +
    encodeURIComponent(
      qrId
    ) +
    "&token=" +
    encodeURIComponent(
      sessionToken
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "API REQUEST:",
    script.src
  );


  // ==========================================================
  // ERROR
  // ==========================================================

  script.onerror =
    function() {

      console.error(
        "Unable to load Apps Script API."
      );


      showError(
        "Unable to connect to check-in server."
      );


      processing =
        false;


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    };


  // ==========================================================
  // LOADED
  // ==========================================================

  script.onload =
    function() {

      console.log(
        "Apps Script request loaded."
      );


      setTimeout(

        function() {

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

        },

        500

      );

    };


  // ==========================================================
  // SEND REQUEST
  // ==========================================================

  document.body.appendChild(
    script
  );

}


// ============================================================
// HANDLE CHECK-IN RESULT
// ============================================================

function handleCheckInResult(
  result
) {

  console.log(
    "CHECK-IN RESULT:",
    result
  );


  // ==========================================================
  // SUCCESS
  // ==========================================================

  if (
    result &&
    result.success
  ) {

    showSuccess(

      "✓ Check-in successful" +

      "<br><br>" +

      "Name: " +
      escapeHtml(
        result.name
      ) +

      "<br>" +

      "Scan Count: " +
      escapeHtml(
        result.scanCount
      )

    );

  }


  // ==========================================================
  // ALREADY CHECKED IN
  // ==========================================================

  else if (
    result &&
    result.alreadyCheckedIn
  ) {

    showWarning(

      "⚠ Already checked in" +

      "<br><br>" +

      "Name: " +
      escapeHtml(
        result.name
      ) +

      "<br>" +

      "Scan Count: " +
      escapeHtml(
        result.scanCount
      )

    );

  }


  // ==========================================================
  // ERROR
  // ==========================================================

  else {

    showError(

      result &&
      result.message

        ? escapeHtml(
            result.message
          )

        : "Check-in failed."

    );

  }


  // ==========================================================
  // READY FOR NEXT SCAN
  // ==========================================================

  setTimeout(

    function() {

      processing =
        false;


      if (
        sessionToken
      ) {

        showInfo(
          "Ready for next QR code."
        );

      }

    },

    3000

  );

}


// ============================================================
// SCAN FAILURE
// ============================================================

function onScanFailure(
  error
) {

  // Normal scanning failures are ignored.

}


// ============================================================
// SHOW SUCCESS
// ============================================================

function showSuccess(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "success";

}


// ============================================================
// SHOW ERROR
// ============================================================

function showError(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "error";

}


// ============================================================
// SHOW WARNING
// ============================================================

function showWarning(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "warning";

}


// ============================================================
// SHOW INFO
// ============================================================

function showInfo(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "info";

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
