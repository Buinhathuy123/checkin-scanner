<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Check-in Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  text-align: center;
}

.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow:
    0 5px 25px
    rgba(0,0,0,0.1);
}

h1 {
  margin-top: 0;
}

#reader {
  width: 100%;
  margin-top: 20px;
}

button {
  padding: 14px 25px;
  border: none;
  border-radius: 10px;
  background: #FFD700;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#status {
  margin-top: 20px;
  font-size: 17px;
  font-weight: bold;
  line-height: 1.5;
}

.success {
  color: green;
}

.error {
  color: red;
}

.info {
  color: #555;
}

.warning {
  color: #d97706;
}

.debug {
  margin-top: 15px;
  font-size: 12px;
  color: #777;
  word-break: break-word;
}

</style>

</head>


<body>


<div class="container">

<h1>
Check-in Scanner
</h1>

<p>
Scan the customer's QR code
</p>


<button
  id="startButton"
  onclick="startScanner()">

Start Camera

</button>


<div id="reader"></div>


<div
  id="status"
  class="info">

Camera not started.

</div>


<div
  id="debug"
  class="debug">
</div>


</div>


<script>


// ============================================================
// CONFIGURATION
// ============================================================

const API_URL =
  "https://script.google.com/macros/s/AKfycbx1LEKvLneIrVQxkM15O8nicV9LxDow8QB0a2ZHad1Nz2nfYyraEOKzqluzKTDlRJoAFQ/exec";


let scanner = null;

let scanning = false;

let processing = false;


// ============================================================
// START SCANNER
// ============================================================

async function startScanner() {

  if (scanning) {
    return;
  }


  const status =
    document.getElementById("status");


  const button =
    document.getElementById("startButton");


  const debug =
    document.getElementById("debug");


  status.innerText =
    "Requesting camera permission...";

  status.className =
    "info";


  debug.innerText =
    "";


  button.disabled = true;


  // ==========================================================
  // CHECK HTTPS
  // ==========================================================

  if (
    location.protocol !== "https:" &&
    location.hostname !== "localhost" &&
    location.hostname !== "127.0.0.1"
  ) {

    status.innerText =
      "Camera requires HTTPS.";

    status.className =
      "error";


    debug.innerText =
      "Open the scanner using your GitHub Pages https:// address.";


    button.disabled = false;

    return;

  }


  // ==========================================================
  // CHECK CAMERA API
  // ==========================================================

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.innerText =
      "Camera is not supported by this browser.";

    status.className =
      "error";


    debug.innerText =
      "navigator.mediaDevices.getUserMedia is unavailable.";


    button.disabled = false;

    return;

  }


  // ==========================================================
  // CREATE SCANNER
  // ==========================================================

  try {

    scanner =
      new Html5Qrcode("reader");

  }

  catch (error) {

    console.error(
      "Scanner creation error:",
      error
    );


    status.innerText =
      "Unable to initialize QR scanner.";

    status.className =
      "error";


    debug.innerText =
      error.message || String(error);


    button.disabled = false;

    return;

  }


  // ==========================================================
  // TRY CAMERA
  // ==========================================================

  try {

    await startCamera(
      { facingMode: "environment" }
    );


    scanning = true;


    status.innerText =
      "Camera ready. Scan QR code.";

    status.className =
      "info";


    debug.innerText =
      "";


  }

  catch (firstError) {

    console.warn(
      "Environment camera failed:",
      firstError
    );


    // ========================================================
    // FALLBACK
    // ========================================================

    try {

      await startCamera(
        { facingMode: "user" }
      );


      scanning = true;


      status.innerText =
        "Camera ready. Scan QR code.";

      status.className =
        "info";


      debug.innerText =
        "Using fallback camera.";


    }

    catch (secondError) {

      console.error(
        "Camera start failed:",
        secondError
      );


      scanning = false;


      button.disabled = false;


      status.innerText =
        "Unable to access camera.";

      status.className =
        "error";


      debug.innerText =
        getCameraErrorMessage(
          secondError
        );


      // ======================================================
      // CLEANUP
      // ======================================================

      try {

        if (scanner) {

          await scanner.clear();

        }

      }

      catch (cleanupError) {

        console.warn(
          "Scanner cleanup error:",
          cleanupError
        );

      }

    }

  }

}


// ============================================================
// START CAMERA HELPER
// ============================================================

function startCamera(
  cameraConfig
) {

  return scanner.start(

    cameraConfig,

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    onScanSuccess,

    onScanFailure

  );

}


// ============================================================
// CAMERA ERROR MESSAGE
// ============================================================

function getCameraErrorMessage(
  error
) {

  if (!error) {

    return "Unknown camera error.";

  }


  const message =
    String(
      error.message ||
      error
    );


  console.error(
    "Camera error:",
    message
  );


  if (
    message.toLowerCase()
      .includes("notallowed")
  ) {

    return (
      "Camera permission was denied. " +
      "Please check browser camera permissions."
    );

  }


  if (
    message.toLowerCase()
      .includes("notfound")
  ) {

    return (
      "No camera was found on this device."
    );

  }


  if (
    message.toLowerCase()
      .includes("notreadable")
  ) {

    return (
      "Camera is being used by another application."
    );

  }


  if (
    message.toLowerCase()
      .includes("security")
  ) {

    return (
      "Camera requires a secure HTTPS connection."
    );

  }


  return (
    "Camera error: " +
    message
  );

}


// ============================================================
// SCAN SUCCESS
// ============================================================

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (processing) {

    return;

  }


  processing = true;


  console.log(
    "QR CONTENT:",
    decodedText
  );


  const qrId =
    extractQrId(
      decodedText
    );


  if (!qrId) {

    showError(
      "Invalid QR code."
    );


    processing = false;

    return;

  }


  console.log(
    "QR ID:",
    qrId
  );


  showInfo(
    "Checking in..."
  );


  checkIn(
    qrId
  );

}


// ============================================================
// EXTRACT QR ID
// ============================================================

function extractQrId(
  qrContent
) {

  if (!qrContent) {

    return null;

  }


  qrContent =
    String(
      qrContent
    ).trim();


  // ==========================================================
  // QR IS URL
  // ==========================================================

  try {

    const url =
      new URL(
        qrContent
      );


    const id =
      url.searchParams.get(
        "id"
      );


    if (id) {

      return String(
        id
      ).trim();

    }

  }

  catch (error) {

    console.log(
      "QR is not a URL."
    );

  }


  // ==========================================================
  // FALLBACK
  // ==========================================================

  if (
    qrContent.length > 0
  ) {

    return qrContent;

  }


  return null;

}


// ============================================================
// CHECK-IN API
//
// GitHub Pages
//       ↓
// JSONP
//       ↓
// Google Apps Script
//       ↓
// Google Sheet
// ============================================================

function checkIn(
  qrId
) {

  const callbackName =
    "checkInCallback_" +
    Date.now();


  console.log(
    "Callback:",
    callbackName
  );


  // ==========================================================
  // CREATE CALLBACK
  // ==========================================================

  window[callbackName] =
    function(result) {

      console.log(
        "CHECK-IN RESPONSE:",
        result
      );


      try {

        handleCheckInResult(
          result
        );

      }

      catch (error) {

        console.error(
          "Response handling error:",
          error
        );


        showError(
          "Invalid response from check-in server."
        );


        processing = false;

      }

      finally {

        delete window[
          callbackName
        ];

      }

    };


  // ==========================================================
  // CREATE SCRIPT
  // ==========================================================

  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=checkIn" +
    "&id=" +
    encodeURIComponent(
      qrId
    ) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    );


  console.log(
    "API REQUEST:",
    script.src
  );


  // ==========================================================
  // ERROR
  // ==========================================================

  script.onerror =
    function() {

      console.error(
        "Unable to load Apps Script API."
      );


      showError(
        "Unable to connect to check-in server."
      );


      processing = false;


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    };


  // ==========================================================
  // LOADED
  // ==========================================================

  script.onload =
    function() {

      console.log(
        "Apps Script request loaded."
      );


      setTimeout(

        function() {

          if (
            script.parentNode
          ) {

            script.parentNode.removeChild(
              script
            );

          }

        },

        500

      );

    };


  // ==========================================================
  // SEND REQUEST
  // ==========================================================

  document.body.appendChild(
    script
  );

}


// ============================================================
// HANDLE CHECK-IN RESULT
// ============================================================

function handleCheckInResult(
  result
) {

  console.log(
    "CHECK-IN RESULT:",
    result
  );


  // ==========================================================
  // SUCCESS
  // ==========================================================

  if (
    result &&
    result.success
  ) {

    showSuccess(

      "✓ Check-in successful" +

      "<br><br>" +

      "Name: " +
      escapeHtml(
        result.name
      ) +

      "<br>" +

      "Scan Count: " +
      escapeHtml(
        result.scanCount
      )

    );

  }


  // ==========================================================
  // ALREADY CHECKED IN
  // ==========================================================

  else if (
    result &&
    result.alreadyCheckedIn
  ) {

    showWarning(

      "⚠ Already checked in" +

      "<br><br>" +

      "Name: " +
      escapeHtml(
        result.name
      ) +

      "<br>" +

      "Scan Count: " +
      escapeHtml(
        result.scanCount
      )

    );

  }


  // ==========================================================
  // ERROR
  // ==========================================================

  else {

    showError(

      result &&
      result.message

        ? escapeHtml(
            result.message
          )

        : "Check-in failed."

    );

  }


  // ==========================================================
  // READY FOR NEXT SCAN
  // ==========================================================

  setTimeout(

    function() {

      processing = false;


      showInfo(
        "Ready for next QR code."
      );

    },

    3000

  );

}


// ============================================================
// SCAN FAILURE
// ============================================================

function onScanFailure(
  error
) {

  // Normal scanning failures are ignored.

}


// ============================================================
// SHOW SUCCESS
// ============================================================

function showSuccess(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "success";

}


// ============================================================
// SHOW ERROR
// ============================================================

function showError(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "error";

}


// ============================================================
// SHOW WARNING
// ============================================================

function showWarning(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "warning";

}


// ============================================================
// SHOW INFO
// ============================================================

function showInfo(
  message
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "info";

}


// ============================================================
// ESCAPE HTML
// ============================================================

function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
